name: Build ScreenRec DMG

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ScreenRec DMG
    runs-on: macos-15

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Apple Environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo ""
          echo "===== Architecture ====="
          uname -m

          echo ""
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== Swift ====="
          swift --version

      - name: Check Project
        run: |
          echo "===== Repository ====="
          find . -maxdepth 4 -type f | sort

          echo ""
          echo "===== Required Files ====="

          test -f Package.swift
          test -f Resources/Info.plist
          test -d Sources/ScreenRec

          echo "Package.swift OK"
          echo "Info.plist OK"
          echo "Sources/ScreenRec OK"

      - name: Resolve Swift Package
        run: |
          swift package resolve

      - name: Build ScreenRec
        run: |
          swift build -c release

          echo ""
          echo "===== Build Output ====="

          ls -lh .build/release/

          test -f .build/release/ScreenRec

          echo ""
          echo "ScreenRec erfolgreich kompiliert"

      - name: Create App Bundle
        run: |
          APP="ScreenRec.app"

          rm -rf "$APP"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp \
            ".build/release/ScreenRec" \
            "$APP/Contents/MacOS/ScreenRec"

          cp \
            "Resources/Info.plist" \
            "$APP/Contents/Info.plist"

          chmod +x \
            "$APP/Contents/MacOS/ScreenRec"

          echo ""
          echo "===== App Structure ====="

          find "$APP" -maxdepth 4 -type f | sort

          echo ""
          echo "===== Info.plist ====="

          plutil -p \
            "$APP/Contents/Info.plist"

          echo ""
          echo "===== Binary ====="

          file \
            "$APP/Contents/MacOS/ScreenRec"

          echo ""
          echo "ScreenRec.app erstellt"

      - name: Sign Application
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            "ScreenRec.app"

          echo ""
          echo "===== Code Signature ====="

          codesign \
            --verify \
            --deep \
            --strict \
            "ScreenRec.app"

          echo ""
          echo "ScreenRec.app erfolgreich signiert"

      - name: Verify Application
        run: |
          test -d "ScreenRec.app"
          test -d "ScreenRec.app/Contents"
          test -d "ScreenRec.app/Contents/MacOS"

          test -f \
            "ScreenRec.app/Contents/MacOS/ScreenRec"

          test -f \
            "ScreenRec.app/Contents/Info.plist"

          echo ""
          echo "App Bundle ist vollständig"

      - name: Prepare DMG
        run: |
          rm -rf dmg

          mkdir -p dmg

          cp -R \
            "ScreenRec.app" \
            "dmg/ScreenRec.app"

          ln -s \
            /Applications \
            "dmg/Applications"

          echo ""
          echo "===== DMG Contents ====="

          ls -la dmg

      - name: Create DMG
        run: |
          rm -f ScreenRec.dmg

          hdiutil create \
            -volname "ScreenRec" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "ScreenRec.dmg"

          test -f ScreenRec.dmg

          echo ""
          echo "===== DMG ====="

          ls -lh ScreenRec.dmg

          echo ""
          echo "ScreenRec.dmg erfolgreich erstellt"

      - name: Verify DMG
        run: |
          echo "===== DMG INFO ====="

          hdiutil imageinfo ScreenRec.dmg

          echo ""
          echo "===== FILE ====="

          file ScreenRec.dmg

          echo ""
          echo "===== SIZE ====="

          ls -lh ScreenRec.dmg

          test -s ScreenRec.dmg

          echo ""
          echo "DMG ist gültig"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-DMG
          path: ScreenRec.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenRec.dmg
          generate_release_notes: true
