name: Build ScreenRec DMG

on:
  workflow_dispatch:

  push:
    branches:
      - main

  tags:
    - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ScreenRec DMG
    runs-on: macos-15

    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Apple / Swift Umgebung prüfen
      # --------------------------------------------------

      - name: Check macOS and Swift
        run: |
          echo "===== macOS ====="
          sw_vers

          echo ""
          echo "===== Architecture ====="
          uname -m

          echo ""
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== Swift ====="
          swift --version


      # --------------------------------------------------
      # 3. Projektstruktur prüfen
      # --------------------------------------------------

      - name: Check Project Files
        run: |
          echo "===== Repository ====="
          find . -maxdepth 4 -type f | sort

          echo ""
          echo "===== Required Files ====="

          test -f Package.swift
          test -f Resources/Info.plist
          test -d Sources/ScreenRec

          echo "✅ Package.swift gefunden"
          echo "✅ Info.plist gefunden"
          echo "✅ Sources/ScreenRec gefunden"


      # --------------------------------------------------
      # 4. Swift Package prüfen
      # --------------------------------------------------

      - name: Resolve Swift Package
        run: |
          swift package resolve


      # --------------------------------------------------
      # 5. Swift Build
      # --------------------------------------------------

      - name: Build Swift Application
        run: |
          swift build \
            -c release

          echo ""
          echo "===== Build Output ====="
          ls -lh .build/release/

          test -f .build/release/ScreenRec

          echo ""
          echo "✅ ScreenRec wurde erfolgreich kompiliert"


      # --------------------------------------------------
      # 6. macOS App Bundle erstellen
      # --------------------------------------------------

      - name: Create macOS App
        run: |
          APP="ScreenRec.app"

          rm -rf "$APP"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp ".build/release/ScreenRec" \
             "$APP/Contents/MacOS/ScreenRec"

          cp "Resources/Info.plist" \
             "$APP/Contents/Info.plist"

          chmod +x \
            "$APP/Contents/MacOS/ScreenRec"

          echo "===== App Bundle ====="
          find "$APP" -maxdepth 4 -type f | sort

          echo ""
          echo "===== Info.plist ====="
          plutil -p "$APP/Contents/Info.plist"

          echo ""
          echo "===== Mach-O ====="
          file "$APP/Contents/MacOS/ScreenRec"

          echo ""
          echo "✅ ScreenRec.app erstellt"


      # --------------------------------------------------
      # 7. App signieren
      # --------------------------------------------------

      - name: Sign Application
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            "ScreenRec.app"

          echo "===== Code Signature ====="

          codesign \
            --verify \
            --deep \
            --strict \
            "ScreenRec.app"

          echo ""
          echo "✅ ScreenRec.app erfolgreich signiert"


      # --------------------------------------------------
      # 8. App Bundle erneut prüfen
      # --------------------------------------------------

      - name: Verify Application
        run: |
          test -d "ScreenRec.app"
          test -d "ScreenRec.app/Contents"
          test -d "ScreenRec.app/Contents/MacOS"

          test -f "ScreenRec.app/Contents/MacOS/ScreenRec"
          test -f "ScreenRec.app/Contents/Info.plist"

          echo "✅ App Bundle ist vollständig"


      # --------------------------------------------------
      # 9. DMG vorbereiten
      # --------------------------------------------------

      - name: Prepare DMG
        run: |
          rm -rf dmg

          mkdir -p dmg

          cp -R \
            "ScreenRec.app" \
            "dmg/ScreenRec.app"

          ln -s \
            /Applications \
            "dmg/Applications"

          echo "===== DMG Contents ====="
          ls -la dmg


      # --------------------------------------------------
      # 10. DMG erstellen
      # --------------------------------------------------

      - name: Create DMG
        run: |
          rm -f ScreenRec.dmg

          hdiutil create \
            -volname "ScreenRec" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "ScreenRec.dmg"

          test -f "ScreenRec.dmg"

          echo ""
          echo "===== DMG ====="
          ls -lh "ScreenRec.dmg"

          echo ""
          echo "✅ ScreenRec.dmg erfolgreich erstellt"


      # --------------------------------------------------
      # 11. DMG prüfen
      # --------------------------------------------------

      - name: Verify DMG
        run: |
          hdiutil imageinfo "ScreenRec.dmg"

          echo ""
          echo "===== DMG File ====="
          file "ScreenRec.dmg"

          test -s "ScreenRec.dmg"

          echo ""
          echo "✅ DMG ist gültig"


      # --------------------------------------------------
      # 12. DMG als GitHub Artifact hochladen
      # --------------------------------------------------

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-DMG
          path: ScreenRec.dmg
          if-no-files-found: error


      # --------------------------------------------------
      # 13. GitHub Release bei v1.0.0 usw.
      # --------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenRec.dmg
          generate_release_notes: true
