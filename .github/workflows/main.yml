name: Build ScreenRec DMG

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ScreenRec DMG
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Apple Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Check Project
        run: |
          test -f Package.swift
          test -f Resources/Info.plist
          test -d Sources/ScreenRec
          echo "Projekt OK"

      - name: Resolve Swift Package
        run: |
          swift package resolve

      - name: Build ScreenRec
        run: |
          swift build -c release
          test -f .build/release/ScreenRec
          echo "ScreenRec erfolgreich kompiliert"

      - name: Create App Bundle
        run: |
          rm -rf ScreenRec.app

          mkdir -p ScreenRec.app/Contents/MacOS
          mkdir -p ScreenRec.app/Contents/Resources

          cp .build/release/ScreenRec \
             ScreenRec.app/Contents/MacOS/ScreenRec

          cp Resources/Info.plist \
             ScreenRec.app/Contents/Info.plist

          chmod +x ScreenRec.app/Contents/MacOS/ScreenRec

          file ScreenRec.app/Contents/MacOS/ScreenRec

      - name: Sign Application
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            ScreenRec.app

          codesign \
            --verify \
            --deep \
            --strict \
            ScreenRec.app

      - name: Prepare DMG
        run: |
          rm -rf dmg
          mkdir -p dmg

          cp -R ScreenRec.app dmg/ScreenRec.app

          ln -s /Applications dmg/Applications

      - name: Create DMG
        run: |
          rm -f ScreenRec.dmg

          hdiutil create \
            -volname "ScreenRec" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            ScreenRec.dmg

          test -s ScreenRec.dmg

          ls -lh ScreenRec.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-DMG
          path: ScreenRec.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenRec.dmg
          generate_release_notes: true
